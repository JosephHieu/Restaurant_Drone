server:
  port: 8080

spring:
  application:
    # ??t tên ch? HOA ?? kh?p v?i Eureka Dashboard
    name: API-GATEWAY

  cloud:
    gateway:
      routes:
        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/users/**, /api/auth/**, /api/cart/**


        - id: restaurant-service
          uri: lb://RESTAURANT-SERVICE
          predicates:
            - Path=/api/restaurants/**

        - id: order-service
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/api/orders/**

        - id: payment-service
          uri: lb://PAYMENT-SERVICE
          predicates:
            - Path=/api/payments/**

        - id: drone-service
          uri: lb://DRONE-SERVICE
          predicates:
            - Path=/api/drones/**

# C?u hình ?? Gateway t? ??ng ký v?i Eureka
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

