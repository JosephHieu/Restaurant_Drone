server:
  port: 8082

spring:
  application:
    name: RESTAURANT-SERVICE

  main:
    banner-mode: off

  datasource:
    url: jdbc:mysql://localhost:3308/restaurant_service
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

eureka:
  instance:
    hostname: localhost
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka

jwt:
  secret: hsXSXV5UGLVBCqob4jHK6FzXCJ8OUtZNSBwdvYXv5I8XiR2Ef9
  expiration-ms: 86400000

storage:
  upload-dir: D:/footfast-uploads

logging:
  level:
    org.springframework.security: DEBUG