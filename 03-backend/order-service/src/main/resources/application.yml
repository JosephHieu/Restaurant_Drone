server:
  port: 8083 # C?ng cho OrderService

spring:
  application:
    name: ORDER-SERVICE

  main:
    banner-mode: off

  datasource:
    url: jdbc:mysql://localhost:3308/order_service # <-- DATABASE M?I
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

# C?u hình Eureka Client
eureka:
  instance:
    hostname: localhost
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

