server:
  port: 8081
  servlet:
    context-path: /

spring:
  # Tắt banner
  main:
    banner-mode: off

  # Bổ sung: Tên ứng dụng (BẮT BUỘC cho Eureka)
  application:
    name: user-service

  # Kết nối tới database (Của bạn đã tốt)
  datasource:
    url: jdbc:mysql://localhost:3308/user_service
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  # jpa
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG

# ===== CÁC PHẦN BỔ SUNG QUAN TRỌNG =====

# 1. Bổ sung: Cấu hình Eureka Client
eureka:
  client:
    serviceUrl:
      # Giả sử Eureka Server của bạn chạy ở port 8761
      defaultZone: http://localhost:8761/eureka/

# 2. Bổ sung: Cấu hình JWT
jwt:
  secret: hsXSXV5UGLVBCqob4jHK6FzXCJ8OUtZNSBwdvYXv5I8XiR2Ef9
  expiration-ms: 86400000 # 1 ngày (24 * 60 * 60 * 1000)