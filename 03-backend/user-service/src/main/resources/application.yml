server:
  port: 8081 # Cổng của UserService

spring:
  application:
    name: USER-SERVICE

  # Tắt banner
  main:
    banner-mode: off

  # Kết nối tới database
  datasource:
    url: jdbc:mysql://localhost:3308/user_service
    username: root
    password: root # Thay bằng mật khẩu của bạn
    driver-class-name: com.mysql.cj.jdbc.Driver

  # jpa
  jpa:
    hibernate:
      ddl-auto: none # Vì chúng ta đã có script SQL
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

# Cấu hình Eureka Client
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka

# Cấu hình JWT
jwt:
  secret: hsXSXV5UGLVBCqob4jHK6FzXCJ8OUtZNSBwdvYXv5I8XiR2Ef9 # Key bí mật của bạn
  expiration-ms: 86400000